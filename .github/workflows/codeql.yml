name: codeql

# Static analysis (SAST) via CodeQL. This repo is Markdown + Bash + JSON with no compiled language,
# so we analyze the `actions` language — CodeQL inspects the GitHub Actions workflows themselves for
# security issues. Results upload to code-scanning and feed the OpenSSF Scorecard SAST check.
#
# ACTIVE: this repo is PUBLIC (Q2/D16), so the code-scanning upload works. Runs on push/PR to `main`,
# a weekly schedule, and manual `workflow_dispatch`.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code-scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
