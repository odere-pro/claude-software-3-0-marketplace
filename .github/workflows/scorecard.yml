name: scorecard

# OpenSSF Scorecard analysis. Backs the "OpenSSF Scorecard" badge — publish_results: true uploads
# the score to the public Scorecard API so the badge renders.
#
# ACTIVE: this repo is PUBLIC (Q2/D16), so the public Scorecard API + code-scanning upload work. Runs
# on a weekly schedule, push to `main`, branch-protection changes, and manual `workflow_dispatch`.

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC
  push:
    branches: ["main"]
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code-scanning
      id-token: write # publish results to the public Scorecard API
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
