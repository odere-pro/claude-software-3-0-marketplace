name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: validation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the commit-author backstop gate (17-commit-author.sh, D15)

      - name: Install jq and shellcheck
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Run gate suite
        run: bash tests/gates/run-all.sh

  history-secret-scan:
    name: gitleaks history scan
    # PR-scoped secret scan over the FULL git history (roadmap P-history-secret-scan, thesis 7/10).
    # Active now — the repo is public (Q2/D16). Shares P14's `fetch-depth: 0` checkout pattern so the
    # whole history is present; gitleaks then FAILs the PR on any planted/committed secret. Runs the
    # license-free gitleaks CLI binary (pinned version + SHA-256 verified) instead of the gitleaks
    # Action, which requires a paid GITLEAKS_LICENSE on org-owned repos. It runs only on pull_request,
    # so it never enters the always-on push suite and never blocks a plain push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit, not just the PR tip

      - name: Scan git history for secrets (gitleaks CLI, license-free)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  reproducible-diff:
    name: reproducible diff (manifest provenance)
    # PR-scoped "green ⇒ machine-generated" check for the manifest's structural fields (roadmap P15).
    # NOT auto-merge — CODEOWNERS still governs merge (D7). Network-free; jq is preinstalled on
    # ubuntu-latest. Kept out of run-all.sh so it never enters the always-on push suite.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the manifest's structural fields are machine-generated
        run: bash .github/scripts/reproducible-diff.sh
